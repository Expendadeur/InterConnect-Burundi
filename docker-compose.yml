version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: interconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - interconnect_network

  redis:
    image: redis:7-alpine
    container_name: interconnect_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - interconnect_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: interconnect_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - interconnect_network

  ai-translation:
    build:
      context: ./ai-services/translation
      dockerfile: ../Dockerfile
    container_name: interconnect_ai_translation
    restart: unless-stopped
    env_file: ./ai-services/.env
    depends_on:
      - redis
    ports:
      - "${AI_TRANSLATION_PORT:-8001}:8000"
    networks:
      - interconnect_network

  ai-stt:
    build:
      context: ./ai-services/speech-to-text
    container_name: interconnect_ai_stt
    restart: unless-stopped
    env_file: ./ai-services/.env
    ports:
      - "${AI_STT_PORT:-8002}:8000"
    networks:
      - interconnect_network

  ai-tts:
    build:
      context: ./ai-services/text-to-speech
    container_name: interconnect_ai_tts
    restart: unless-stopped
    env_file: ./ai-services/.env
    ports:
      - "${AI_TTS_PORT:-8003}:8000"
    networks:
      - interconnect_network

  livekit:
    image: livekit/livekit-server:latest
    container_name: interconnect_livekit
    restart: unless-stopped
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - interconnect_network

  nginx:
    image: nginx:alpine
    container_name: interconnect_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - backend
    networks:
      - interconnect_network

volumes:
  postgres_data:
  redis_data:
  nginx_certs:

networks:
  interconnect_network:
    driver: bridge
