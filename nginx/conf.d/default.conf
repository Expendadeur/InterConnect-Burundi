upstream backend {
    server backend:3000;
}

upstream ai_translation {
    server ai-translation:8000;
}

upstream ai_stt {
    server ai-stt:8000;
}

upstream ai_tts {
    server ai-tts:8000;
}

server {
    listen 80;
    server_name _;

    # Uncomment in production to redirect HTTP → HTTPS
    # return 301 https://$host$request_uri;

    # ------------------------------------------------
    # API Backend (NestJS)
    # ------------------------------------------------
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # ------------------------------------------------
    # WebSocket — real-time messaging (Socket.IO)
    # ------------------------------------------------
    location /socket.io/ {
        proxy_pass http://backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ------------------------------------------------
    # AI — Translation service
    # ------------------------------------------------
    location /ai/translate/ {
        proxy_pass http://ai_translation/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------
    # AI — Speech-to-Text service
    # ------------------------------------------------
    location /ai/stt/ {
        proxy_pass http://ai_stt/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25M;
    }

    # ------------------------------------------------
    # AI — Text-to-Speech service
    # ------------------------------------------------
    location /ai/tts/ {
        proxy_pass http://ai_tts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------
    # Health check
    # ------------------------------------------------
    location /health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
    }

    # ------------------------------------------------
    # Deny hidden files
    # ------------------------------------------------
    location ~ /\. {
        deny all;
    }
}
