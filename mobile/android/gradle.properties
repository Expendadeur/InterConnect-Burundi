org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true

# Use local aapt2 from build-tools — avoids download from dl.google.com
android.aapt2FromMavenOverride=C:/Android/SDK/build-tools/35.0.0/aapt2.exe

systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=300000
org.gradle.daemon=true
org.gradle.parallel=false
