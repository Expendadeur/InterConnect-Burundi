name: interconnect_burundi
description: "One World. No Language Barriers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # HTTP
  dio: ^5.5.0+1

  # Environment
  flutter_dotenv: ^5.1.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Supabase
  supabase_flutter: ^2.5.6

  # LiveKit (calls)
  livekit_client: ^2.1.6

  # WebSocket
  socket_io_client: ^2.0.3+1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  shimmer: ^3.0.0

  # Utils
  intl: ^0.20.2
  timeago: ^3.6.1
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
